<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Birthday, My Love</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,500&family=Inter:wght@400;500&family=Vazirmatn:wght@500&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff7f6;--surface:#fff;--text:#3a2530;--muted:#8a6b77;--accent:#d6456e;--soft:#f4a3b8;--line:#f3d9df;--ok:#2e9e6b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1217;--surface:#271a21;--text:#fbeaf0;--muted:#c4a0ae;--accent:#ff6f9a;--soft:#7a2f47;--line:#3b2630;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1c1217;--surface:#271a21;--text:#fbeaf0;--muted:#c4a0ae;--accent:#ff6f9a;--soft:#7a2f47;--line:#3b2630;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;line-height:1.6}
h1,h2,h3{font-family:"Playfair Display",Georgia,serif;font-weight:600;margin:0}
.wrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 20px;background:radial-gradient(ellipse at 50% 15%,var(--soft),transparent 65%)}
.stage{display:none;width:100%;max-width:520px;animation:in .5s}
.stage.on{display:block}
@keyframes in{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.hero small{letter-spacing:.3em;text-transform:uppercase;color:var(--muted)}
.hero h1{font-size:clamp(2.4rem,9vw,4.6rem);margin:14px 0;line-height:1.1}
.hero em{color:var(--accent)}
.hero p{color:var(--muted);margin:0 0 26px}
.btn{background:var(--accent);color:#fff;border:0;border-radius:999px;padding:13px 28px;font:500 1rem Inter,sans-serif;cursor:pointer}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:30px 24px;box-shadow:0 10px 40px rgba(214,69,110,.1)}
.card h3{font-size:1.5rem;margin-bottom:14px}
.step{color:var(--muted);font-size:.85rem;margin-bottom:10px}
.dots{display:flex;gap:6px;justify-content:center;margin-bottom:18px}
.dots i{width:28px;height:5px;border-radius:5px;background:var(--line)}
.dots i.on{background:var(--accent)}
.big{font-size:4rem;line-height:1}
.num{font-family:"Playfair Display",Georgia,serif;font-size:2.4rem;color:var(--accent);margin:6px 0}
input[type=range]{width:100%;accent-color:var(--accent);margin:14px 0}
input[type=text]{width:100%;padding:14px 16px;border-radius:12px;border:1.5px solid var(--line);background:transparent;color:var(--text);font:500 1.3rem Vazirmatn,Inter,sans-serif;text-align:center;margin:10px 0 14px}
.opt{display:block;width:100%;text-align:left;margin-top:10px;padding:13px 16px;border-radius:12px;border:1.5px solid var(--line);background:transparent;color:var(--text);font:inherit;cursor:pointer}
.opt:hover{border-color:var(--accent)}
.opt.ok{border-color:var(--ok);background:rgba(46,158,107,.15)}
.opt.bad{border-color:#d64545;background:rgba(214,69,69,.12)}
.msg{min-height:1.6em;margin:10px 0 0;color:var(--muted)}
#reward{max-width:760px;margin:0 auto;padding:56px 20px;display:none}
#reward h2{font-size:clamp(1.8rem,5vw,2.6rem);text-align:center}
.sub{text-align:center;color:var(--muted);margin:6px 0 24px}
.letter{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:30px;box-shadow:0 10px 40px rgba(214,69,110,.1)}
.letter p{margin:0 0 14px}
.sign{font-family:"Playfair Display",Georgia,serif;font-style:italic;color:var(--accent);font-size:1.3rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:30px 18px;margin-top:10px;padding:14px 8px}
.ph{background:#fff;padding:9px 9px 6px;border-radius:4px;box-shadow:0 8px 22px rgba(0,0,0,.2);transform:rotate(var(--r,0deg));transition:transform .3s;cursor:zoom-in;position:relative;color:#3a2530}
.ph:hover{transform:rotate(0) scale(1.07);z-index:2}
.ph::before{content:'';position:absolute;top:-9px;left:50%;width:54px;height:17px;transform:translateX(-50%) rotate(-3deg);background:rgba(244,163,184,.8)}
.ph span{display:block;text-align:center;font-family:'Playfair Display',Georgia,serif;font-style:italic;font-size:.9rem;padding:8px 2px 2px}
.ph img{width:100%;aspect-ratio:1;object-fit:cover;object-position:center 30%;display:block}
.tools{display:none}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.88);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
#lb.on{display:flex}#lb img{max-width:100%;max-height:100%;border-radius:12px}
#cf{position:fixed;inset:0;pointer-events:none;z-index:40}
footer{text-align:center;color:var(--muted);padding:10px 20px 50px}
#lb img{max-height:76vh}
.nv{position:absolute;top:50%;transform:translateY(-50%);width:46px;height:46px;border-radius:50%;border:0;background:rgba(255,255,255,.22);color:#fff;font-size:1.8rem;line-height:1;cursor:pointer}
#lprev{left:10px}#lnext{right:10px}
#lcap{position:absolute;bottom:calc(24px + env(safe-area-inset-bottom,0px));left:0;right:0;text-align:center;color:#fff;font-family:'Playfair Display',Georgia,serif;font-style:italic;font-size:1.2rem}
</style>
</head>
<body>
<canvas id="cf"></canvas>

<div class="wrap" id="quest">
  <div class="stage on hero" id="s0">
    <small>A little surprise</small>
    <h1>Happy Birthday,<br><em id="name"></em></h1>
    <p>Answer 3 questions to open your gift 🎁</p>
    <button class="btn" onclick="go(1)">Let’s start</button>
  </div>

  <div class="stage" id="s1"><div class="card">
    <div class="dots"><i class="on"></i><i></i><i></i></div>
    <div class="step">Question 1 of 3</div>
    <h3>Do you love me? How much?</h3>
    <div class="big" id="em">🤍</div>
    <div class="num"><span id="val">0</span>%</div>
    <input type="range" id="rg" min="0" max="100" value="0">
    <div class="msg" id="m1"></div>
    <button class="btn" id="b1" disabled>Next</button>
  </div></div>

  <div class="stage" id="s2"><div class="card">
    <div class="dots"><i class="on"></i><i class="on"></i><i></i></div>
    <div class="step">Question 2 of 3</div>
    <h3>What is my favorite word?</h3>
    <input type="text" id="ans" dir="auto" placeholder="…" autocomplete="off">
    <div class="msg" id="m2"></div>
    <button class="btn" id="b2">Check</button>
  </div></div>

  <div class="stage" id="s3"><div class="card">
    <div class="dots"><i class="on"></i><i class="on"></i><i class="on"></i></div>
    <div class="step" id="lstep"></div>
    <h3 id="lq"></h3>
    <div id="lo"></div>
    <div class="msg" id="m3"></div>
  </div></div>
</div>

<div id="reward">
  <h2>🎉 Happy Birthday! 🎉</h2>
  <p class="sub">This is for you</p>
  <div class="letter"><div id="gl2"></div></div>
  <div class="letter" style="margin-top:22px"><div id="gl2"></div></div>
  <h2 style="margin-top:46px">Our album 📖</h2><p class="sub">Little pieces of us</p>
  <div class="grid" id="grid"></div>
  <div class="tools"><button class="btn ghost" id="add">＋ Add photos</button><input type="file" id="file" accept="image/*" multiple hidden></div>
  <footer>Made with love m.19</footer>
</div>
<div id="lb"><button class="nv" id="lprev" aria-label="Previous">‹</button><img alt=""><button class="nv" id="lnext" aria-label="Next">›</button><div id="lcap"></div></div>

  var v=+this.value;$("val").textContent=v;$("em").textContent=ems[Math.min(9,Math.floor(v/10))];
  $("m1").textContent=v>=100?"That’s the answer I wanted! 😍":v>=70?"Only that much? Come on… 😏":v>0?"Hmm, much more than that! 😤":"";
  $("b1").disabled=v<100;
};
$("b1").onclick=function(){burst();go(2);setTimeout(function(){$("ans").focus()},300)};
/* Q2 */
function norm(s){return s.replace(/\u064A/g,"\u06CC").replace(/\u0643/g,"\u06A9").replace(/[\u200c\s]/g,"").toLowerCase()}
function chk(){
  var v=norm($("ans").value);if(!v)return;
  var ok=CONFIG.favWords.some(function(w){var n=norm(w),last=n.slice(-1);
    return v===n||(v.indexOf(n)===0&&v.slice(n.length).split("").every(function(c){return c===last}))});
  if(ok){$("m2").textContent="You know me so well! 💕";burst();setTimeout(function(){go(3);showL()},900)}
  else $("m2").textContent="Not that one, think again 😉";
}
$("b2").onclick=chk;$("ans").onkeydown=function(e){if(e.key==="Enter")chk()};
/* Q3 */
var li=0;
function showL(){
  var x=CONFIG.lovely[li];
  $("lstep").textContent="Question 3 of 3";
  $("lq").textContent=x.q;$("m3").textContent="";
  $("lo").innerHTML=x.a.map(function(t){return '<button class="opt">'+t+'</button>'}).join("");
}
$("lo").onclick=function(e){
  var b=e.target.closest(".opt");if(!b||b.classList.contains("ok")||b.classList.contains("bad"))return;
  var x=CONFIG.lovely[li];
  if(x.c!==undefined&&b.textContent!==x.a[x.c]){b.classList.add("bad");$("m3").textContent="Not quite, think again 😉";return}
  b.classList.add("ok");$("m3").textContent=x.r;
  setTimeout(function(){li++;if(li<CONFIG.lovely.length)showL();else openGift()},1300);
};
function openGift(){
  burst();$("quest").style.display="none";$("reward").style.display="block";scrollTo(0,0);setTimeout(burst,500);
}
/* Gallery */
var added=[];try{localStorage.removeItem("bq_photos")}catch(e){}
var RS=[-3,2.5,-2,3,-1.5,2,-2.5];
function all(){return CONFIG.photos.concat(added)}
function render(){$("grid").innerHTML=all().map(function(s,i){return '<div class="ph" data-i="'+i+'" style="--r:'+RS[i%7]+'deg"><img src="'+s+'" alt="Our memory" loading="lazy"><span>'+(CONFIG.captions[i]||"")+'</span></div>'}).join("")}
render();
$("add").onclick=function(){$("file").click()};
$("file").onchange=function(e){
  Array.prototype.forEach.call(e.target.files,function(f){
    var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){
      var s=Math.min(1,900/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*s;c.height=im.height*s;
      c.getContext("2d").drawImage(im,0,0,c.width,c.height);added.push(c.toDataURL("image/jpeg",.8));
      try{localStorage.setItem("bq_photos",JSON.stringify(added))}catch(x){}render()};im.src=r.result};r.readAsDataURL(f)});
  e.target.value="";
};
var cur=0;
function show(i){var a=all();cur=(i+a.length)%a.length;$("lb").querySelector("img").src=a[cur];$("lcap").textContent=CONFIG.captions[cur]||"";$("lb").classList.add("on")}
$("grid").onclick=function(e){var p=e.target.closest(".ph");if(p)show(+p.dataset.i)};
$("lprev").onclick=function(e){e.stopPropagation();show(cur-1)};
$("lnext").onclick=function(e){e.stopPropagation();show(cur+1)};
$("lb").onclick=function(){$("lb").classList.remove("on")};
addEventListener("keydown",function(e){if(!$("lb").classList.contains("on"))return;
  if(e.key==="Escape")$("lb").classList.remove("on");if(e.key==="ArrowLeft")show(cur-1);if(e.key==="ArrowRight")show(cur+1)});
var tx=0;$("lb").addEventListener("touchstart",function(e){tx=e.touches[0].clientX},{passive:true});
$("lb").addEventListener("touchend",function(e){var d=e.changedTouches[0].clientX-tx;if(Math.abs(d)>50)show(cur+(d<0?1:-1))});
/* Confetti */
var cv=$("cf"),cx=cv.getContext("2d"),ps=[],run=false;
function sz(){cv.width=innerWidth;cv.height=innerHeight}sz();addEventListener("resize",sz);
function burst(){var cols=["#d6456e","#f4a3b8","#ffd166","#fff","#ff8fab"];
  for(var i=0;i<120;i++)ps.push({x:innerWidth/2,y:innerHeight/2,vx:(Math.random()-.5)*16,vy:Math.random()*-14-2,s:Math.random()*8+4,c:cols[i%5],r:Math.random()*6,l:140+Math.random()*60});
  if(!run){run=true;tick()}}
function tick(){cx.clearRect(0,0,cv.width,cv.height);ps=ps.filter(function(p){return p.l-->0});
  ps.forEach(function(p){p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.r+=.2;cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);cx.restore()});
  if(ps.length)requestAnimationFrame(tick);else{run=false;cx.clearRect(0,0,cv.width,cv.height)}}
</script>
</body>
</html>
